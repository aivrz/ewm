<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP网络免费在线二维码生成器</title>
    <meta
      name="description"
      content="纯前端在线二维码生成器，支持文本、网址、联系卡、电话、短信、WiFi、邮件模板，以及渐变、码眼配色、Logo 叠加与文字特效。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="topbar">
      <h1>IP网络免费在线二维码生成器</h1>
      <p class="subtitle">纯前端生成 · 内容不出浏览器 · 支持 Cloudflare 静态托管</p>
    </header>

    <main class="layout">
      <!-- 左栏：预览与下载 -->
      <section class="panel preview-panel">
        <div class="canvas-wrap">
          <canvas id="canvas" width="320" height="320" aria-label="二维码预览"></canvas>
        </div>

        <div class="status" id="status" role="status" aria-live="polite"></div>

        <div class="download-block">
          <label class="field">
            <span>二维码文件名</span>
            <input type="text" id="fileName" value="qrcode" />
          </label>

          <div class="format-row" role="group" aria-label="导出格式">
            <button type="button" class="btn" data-export="png">下载 PNG</button>
            <button type="button" class="btn" data-export="jpeg">下载 JPG</button>
            <button type="button" class="btn" data-export="webp">下载 WEBP</button>
            <button type="button" class="btn" data-export="svg">下载 SVG</button>
          </div>

          <details class="share-block">
            <summary>分享 / 复制内容</summary>
            <textarea id="shareContent" rows="3" readonly></textarea>
            <button type="button" class="btn btn-ghost" id="copyContent">复制内容</button>
          </details>
        </div>
      </section>

      <!-- 右栏：编辑区 -->
      <section class="panel editor-panel">
        <!-- 模板标签页 -->
        <nav class="tabs" id="tabs" role="tablist">
          <button type="button" class="tab active" data-template="text" role="tab">免费文本</button>
          <button type="button" class="tab" data-template="url" role="tab">网址</button>
          <button type="button" class="tab" data-template="card" role="tab">联系卡</button>
          <button type="button" class="tab" data-template="telephone" role="tab">手机</button>
          <button type="button" class="tab" data-template="sms" role="tab">短信</button>
          <button type="button" class="tab" data-template="wifi" role="tab">无线上网</button>
          <button type="button" class="tab" data-template="mail" role="tab">邮件</button>
        </nav>

        <!-- 模板表单 -->
        <div class="form-block" data-pane="text">
          <label class="field">
            <span>输入文本</span>
            <textarea id="f-text" rows="3" placeholder="输入要编码的文本"></textarea>
          </label>
        </div>

        <div class="form-block" data-pane="url" hidden>
          <label class="field">
            <span>输入网址</span>
            <input type="text" id="f-url" placeholder="https://example.com" />
          </label>
        </div>

        <div class="form-block" data-pane="card" hidden>
          <label class="field"><span>姓名</span><input type="text" id="f-cardName" /></label>
          <div class="grid-2">
            <label class="field"><span>联系电话</span><input type="text" id="f-cardTel" /></label>
            <label class="field"><span>手机电话</span><input type="text" id="f-cardPhone" /></label>
            <label class="field"><span>传真号</span><input type="text" id="f-cardFax" /></label>
            <label class="field"><span>电子邮件</span><input type="email" id="f-cardMail" /></label>
            <label class="field"><span>单位</span><input type="text" id="f-cardOrg" /></label>
            <label class="field"><span>职位</span><input type="text" id="f-cardTitle" /></label>
          </div>
          <label class="field"><span>网址</span><input type="text" id="f-cardUrl" placeholder="https://" /></label>
          <label class="field"><span>街道地址</span><input type="text" id="f-cardAddr" /></label>
          <label class="field"><span>备注</span><input type="text" id="f-cardNote" /></label>
        </div>

        <div class="form-block" data-pane="telephone" hidden>
          <label class="field"><span>电话号码</span><input type="tel" id="f-tel" /></label>
        </div>

        <div class="form-block" data-pane="sms" hidden>
          <label class="field"><span>手机号码</span><input type="tel" id="f-smsTel" /></label>
          <label class="field"><span>短信内容</span><textarea id="f-smsBody" rows="3"></textarea></label>
        </div>

        <div class="form-block" data-pane="wifi" hidden>
          <label class="field"><span>无线上网 ID</span><input type="text" id="f-wifiSsid" /></label>
          <label class="field"><span>密码</span><input type="text" id="f-wifiPass" /></label>
          <label class="field">
            <span>加密类型</span>
            <select id="f-wifiEnc">
              <option value="WPA">WPA/WPA2/WPA3</option>
              <option value="WEP">WEP</option>
              <option value="nopass">无密码</option>
            </select>
          </label>
        </div>

        <div class="form-block" data-pane="mail" hidden>
          <label class="field"><span>邮箱地址</span><input type="email" id="f-mail" /></label>
        </div>

        <!-- 详细设置 -->
        <details class="accordion" open>
          <summary>◆ 详细设置</summary>
          <div class="accordion-body">
            <h3>颜色设置</h3>
            <div class="grid-3">
              <label class="field color">
                <span>前景颜色</span><input type="color" id="fgColor" value="#000000" />
              </label>
              <label class="field color">
                <span>背景颜色</span><input type="color" id="bgColor" value="#ffffff" />
              </label>
              <label class="field color">
                <span>渐变终点色</span><input type="color" id="gcColor" value="#1d9e75" />
              </label>
              <label class="field color">
                <span>码眼外框</span><input type="color" id="ptColor" value="#000000" />
              </label>
              <label class="field color">
                <span>码眼内框</span><input type="color" id="inptColor" value="#000000" />
              </label>
              <label class="field color">
                <span>文字颜色</span><input type="color" id="ftColor" value="#000000" />
              </label>
            </div>

            <div class="grid-2">
              <label class="field checkbox">
                <input type="checkbox" id="ptFollow" checked />
                <span>码眼外框跟随前景色</span>
              </label>
              <label class="field checkbox">
                <input type="checkbox" id="inptFollow" checked />
                <span>码眼内框跟随前景色</span>
              </label>
            </div>

            <div class="grid-2">
              <label class="field checkbox">
                <input type="checkbox" id="gradientEnabled" />
                <span>启用渐变</span>
              </label>
              <label class="field">
                <span>渐变方式</span>
                <select id="gradientWay">
                  <option value="horizontal">水平</option>
                  <option value="vertical">垂直</option>
                  <option value="diagonal">斜线</option>
                  <option value="anti-diagonal">反斜线</option>
                  <option value="radial">圆形</option>
                </select>
              </label>
            </div>

            <h3>图案样式</h3>
            <div class="grid-2">
              <label class="field">
                <span>码点形状</span>
                <select id="dotStyle">
                  <option value="square">方形</option>
                  <option value="rounded">圆角</option>
                  <option value="dots">圆形</option>
                  <option value="classy">轻圆角</option>
                  <option value="classy-rounded">中圆角</option>
                  <option value="extra-rounded">重圆角</option>
                </select>
              </label>
              <label class="field">
                <span>码眼形状</span>
                <select id="finderStyle">
                  <option value="square">方形</option>
                  <option value="rounded">圆角</option>
                  <option value="extra-rounded">重圆角</option>
                  <option value="dot">圆点</option>
                </select>
              </label>
            </div>
            <label class="field">
              <span>圆角程度：<b id="roundRatioValue">0.30</b></span>
              <input type="range" id="roundRatio" min="0" max="0.5" step="0.01" value="0.3" />
            </label>
            <label class="field checkbox">
              <input type="checkbox" id="isWater" />
              <span>水滴码点</span>
            </label>

            <h3>嵌入 Logo</h3>
            <div class="grid-2">
              <label class="field">
                <span>Logo 文件</span>
                <input type="file" id="logoInput" accept="image/*" />
              </label>
              <label class="field">
                <span>叠加方式</span>
                <select id="logoType">
                  <option value="icon">圆角</option>
                  <option value="border">白色边框</option>
                  <option value="stroke">描边</option>
                  <option value="raw">原图</option>
                </select>
              </label>
            </div>

            <h3>嵌入文本</h3>
            <label class="field">
              <span>文本内容</span>
              <input type="text" id="ctext" />
            </label>
            <div class="grid-2">
              <label class="field">
                <span>文本特效</span>
                <select id="fontEffect">
                  <option value="none">无</option>
                  <option value="inner">内融合</option>
                  <option value="outer">外融合</option>
                  <option value="stretch">拉伸</option>
                  <option value="three-d">3D 效果</option>
                  <option value="glow">发光</option>
                </select>
              </label>
              <label class="field">
                <span>字体大小：<b id="fontSizeValue">28</b></span>
                <input type="range" id="fontSize" min="8" max="96" step="1" value="28" />
              </label>
            </div>

            <h3>其他设置</h3>
            <div class="grid-2">
              <label class="field">
                <span>二维码宽高：<b id="sizeValue">320</b></span>
                <input type="range" id="size" min="160" max="1024" step="10" value="320" />
              </label>
              <label class="field">
                <span>外边距（模块）</span>
                <select id="margin">
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="4" selected>4</option>
                  <option value="6">6</option>
                  <option value="8">8</option>
                </select>
              </label>
              <label class="field">
                <span>纠错等级</span>
                <select id="level">
                  <option value="L">最低 L（7%）</option>
                  <option value="M">较低 M（15%）</option>
                  <option value="Q" selected>较高 Q（25%）</option>
                  <option value="H">最高 H（30%）</option>
                </select>
              </label>
              <label class="field">
                <span>旋转角度</span>
                <select id="rotate">
                  <option value="0" selected>0°</option>
                  <option value="90">90°</option>
                  <option value="180">180°</option>
                  <option value="270">270°</option>
                </select>
              </label>
            </div>

            <button type="button" class="btn btn-ghost" id="resetAll">恢复默认设置</button>
          </div>
        </details>
      </section>
    </main>

    <footer class="footer">
      <p>
        内容与图片全部在浏览器本地处理，不上传服务器。所有二维码均可扫码验证，
        <b>建议纠错等级不低于 Q</b>；带 Logo 或美化时建议使用 H。
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
